name: Deploy to Infomaniak

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Deploy with Rsync
        env:
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          sudo apt-get install -y sshpass rsync
          export SSHPASS=$SSH_PASSWORD
          sshpass -e rsync -rlvz --delete -e "ssh -o StrictHostKeyChecking=no" dist/ $SSH_USER@$SSH_HOST:sites/karate-shotokan.fr/ || true

      - name: 🚨 Notify Kuroko of failure
        if: failure()
        env:
          WEBHOOK_URL: ${{ secrets.FAILURE_WEBHOOK_URL }}
        run: |
          if [ -n "$WEBHOOK_URL" ]; then
            curl -X POST -H "Content-Type: application/json" \
            -d "{\"event\": \"deploy_failed\", \"repo\": \"${{ github.repository }}\", \"run_id\": \"${{ github.run_id }}\", \"message\": \"Le déploiement a échoué sur karate-shotokan.\"}" \
            $WEBHOOK_URL
          else
            echo "⚠️ FAILURE_WEBHOOK_URL non configuré, impossible d'alerter Kuroko."
          fi
